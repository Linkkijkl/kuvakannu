[package]
name = "kuvakannu"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = "0.7.0"
actix-web = "4.15.0"
anyhow = "1.0.104"
async-recursion = "1.1.1"
colog = "1.4.0"
compile-time = { version = "0.3.7", features = ["time"], default-features = false }
futures-lite = "2.6.1"
image = "0.25.10"
include_dir = "0.7.4"
log = "0.4.34"
markdown = "1.0.0"
mime_guess = "2.0.5"
sailfish = "0.11.4"
tokio = { version = "1.53.1", features = ["fs"] }
tokio-util = "0.7.19"
webp = "0.3.1"

[dev-dependencies]
reqwest = { version = "0.13.4", features = ["blocking"] }
